<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f6f9fc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333333;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f6f9fc; padding: 20px 0;">
        <tr>
            <td align="center">
                <!-- Email Container Table -->
                <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);">
                    
                    <!-- Header Banner -->
                    <tr>
                        <td align="center" style="background-color: #4f46e5; padding: 30px 20px;">
                            <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 0.5px;">$title</h1>
                        </td>
                    </tr>
                    
                    <!-- Main Body Content -->
                    <tr>
                        <td style="padding: 40px 30px;">
                            <p style="margin-top: 0; font-size: 16px; line-height: 1.6; color: #4b5563;">Hi Team,</p>
                            <p style="font-size: 16px; line-height: 1.6; color: #4b5563;">$intro_text</p>
                            
                            <!-- Styled Data Table -->
                            <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-top: 30px; margin-bottom: 30px; border-collapse: collapse; font-size: 14px;">
                                <thead>
                                    <tr style="background-color: #f3f4f6; text-align: left;">
                                        <th style="padding: 12px 16px; border-bottom: 2px solid #e5e7eb; font-weight: 600; color: #374151;">Filename</th>
                                        <th style="padding: 12px 16px; border-bottom: 2px solid #e5e7eb; font-weight: 600; color: #374151; text-align: left;">Date modified</th>
                                    </tr>
                                </thead>
                                <tbody>
									$table_rows
                                </tbody>
                            </table>
                            
                            <p style="font-size: 16px; line-height: 1.6; color: #4b5563; margin-bottom: 0;">Best regards,<br><strong style="color: #111827;">Operations Team</strong></p>
                        </td>
                    </tr>
                    
                    <!-- Footer Section -->
                    <tr>
                        <td align="center" style="background-color: #f9fafb; padding: 20px; border-top: 1px solid #e5e7eb;">
                            <p style="margin: 0; font-size: 12px; color: #9ca3af;">You are receiving this automated report because you are assigned to sFTP download reports.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
